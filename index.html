<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parthasarathi S | Computer Science & Engineering Student</title>
  <meta name="description" content="Portfolio portal of Parthasarathi S - Computer Science & Engineering Student. Interest Domains: Software Engineering and Data Analytics.">
  <meta name="theme-color" content="#05030a">

  <!-- Open Graph -->
  <meta property="og:title" content="Parthasarathi S | Computer Science & Engineering Student">
  <meta property="og:description" content="Computer Science & Engineering Student. Interest Domains: Software Engineering & Data Analytics.">
  <meta property="og:image" content="parthu.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #05030a;
      --purple-primary: #a855f7;
      --purple-light: #c084fc;
      --purple-neon: #d946ef;
      --purple-glow: rgba(168, 85, 247, 0.45);
      --font-heading: 'Space Grotesk', 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
    }

    /* Single-viewport fit (No scroll needed on desktop/laptop) */
    @media (min-height: 560px) {
      body {
        overflow: hidden;
      }
    }

    /* Fullscreen Supernova Burst & Living Sparkles Canvas */
    #sparkle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Atmospheric Cosmic Glow */
    .cosmic-glow-top {
      position: fixed;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.16) 0%, rgba(217, 70, 239, 0.05) 50%, transparent 70%);
      filter: blur(85px);
      pointer-events: none;
      z-index: 0;
    }

    /* Portal Main Container */
    .portal-container {
      position: relative;
      z-index: 10;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    /* Sequential Reveal Elements (Photo & Bottom Details fade in after sparkles assemble) */
    .reveal-item {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .avatar-section {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .details-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .avatar-section.reveal-item {
      transform: translateY(-16px);
    }

    .details-section.reveal-item {
      transform: translateY(16px);
    }

    .reveal-item.revealed {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* Circular Photo Avatar (Glowing Purple Halo, No Card Box) */
    .avatar-wrapper {
      position: relative;
      width: 115px;
      height: 115px;
      margin-bottom: 12px;
      animation: avatarFloat 4s ease-in-out infinite alternate;
    }

    @keyframes avatarFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    .avatar-orbit-outer {
      position: absolute;
      inset: -10px;
      border: 1.5px dashed rgba(192, 132, 252, 0.55);
      border-radius: 50%;
      animation: orbitSpin 16s linear infinite;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
    }

    .avatar-orbit-inner {
      position: absolute;
      inset: -5px;
      border: 1px solid rgba(217, 70, 239, 0.35);
      border-radius: 50%;
      animation: orbitSpinReverse 11s linear infinite;
    }

    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes orbitSpinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      background: radial-gradient(circle, #a855f7 20%, #d946ef 60%, transparent 80%);
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.65;
      animation: glowBreathe 3s ease-in-out infinite alternate;
    }

    @keyframes glowBreathe {
      0% { transform: scale(0.95); opacity: 0.45; }
      100% { transform: scale(1.06); opacity: 0.85; }
    }

    .avatar-photo-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid #c084fc;
      background: #090514;
      z-index: 2;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8), 0 0 20px rgba(168, 85, 247, 0.35);
    }

    .avatar-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.4s ease;
    }

    .avatar-wrapper:hover .avatar-photo-frame img {
      transform: scale(1.08);
    }

    /* Permanent Sparkle Typography Container (Hi 👋, I'm Parthasarathi S) */
    .sparkle-hero-container {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 0 auto 6px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
    }

    .title-anchor {
      width: 100%;
      min-height: 120px;
      pointer-events: none;
    }

    /* Real Normal Font Emoji with Active Shimmering Wave */
    .emoji-wrapper {
      position: fixed;
      z-index: 15;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .emoji-wrapper.emoji-visible {
      opacity: 1;
    }

    .wave-emoji {
      display: inline-block;
      font-size: clamp(1.6rem, 3.5vw, 2.1rem);
      transform-origin: 70% 70%;
      animation: waveHand 2.2s infinite ease-in-out, emojiGlow 3s infinite alternate ease-in-out;
    }

    @keyframes waveHand {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(14deg); }
      50% { transform: rotate(-4deg); }
    }

    @keyframes emojiGlow {
      0% {
        filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.65)) drop-shadow(0 0 12px rgba(217, 70, 239, 0.35));
      }
      100% {
        filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.95)) drop-shadow(0 0 24px rgba(192, 132, 252, 0.65));
      }
    }

    /* Screen-reader accessible title */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    /* Academic Title (Computer Science & Engineering Student) */
    .portal-academic {
      font-family: var(--font-heading);
      font-size: clamp(1rem, 2.4vw, 1.18rem);
      font-weight: 600;
      color: #d8b4fe;
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .portal-academic i {
      color: #c084fc;
    }

    /* Interest Domains (Compact Futuristic Cyber Badges) */
    .domains-compact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .domain-label {
      font-family: var(--font-heading);
      font-size: 0.84rem;
      font-weight: 700;
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .domain-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(22, 14, 44, 0.7);
      border: 1px solid rgba(168, 85, 247, 0.35);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .domain-tag i {
      color: #d946ef;
      font-size: 0.85rem;
    }

    .domain-tag:hover {
      border-color: #c084fc;
      transform: translateY(-2px);
      background: rgba(36, 20, 68, 0.85);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
    }

    /* Primary Enter Portfolio Button */
    .portal-cta {
      margin: 0 auto 16px auto;
      width: 100%;
      max-width: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 28px;
      background: linear-gradient(135deg, #a855f7 0%, #d946ef 100%);
      color: #ffffff;
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.45);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .enter-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 30%,
        rgba(255, 255, 255, 0.25) 50%,
        transparent 70%
      );
      transform: rotate(-30deg) translateY(-100%);
      transition: transform 0.65s ease;
    }

    .enter-btn:hover::after {
      transform: rotate(-30deg) translateY(100%);
    }

    .enter-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 35px rgba(217, 70, 239, 0.65);
      color: #ffffff;
    }

    .enter-btn i {
      transition: transform 0.25s ease;
      font-size: 1rem;
    }

    .enter-btn:hover i {
      transform: translateX(5px);
    }

    /* Social Shortcuts */
    .portal-socials {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .social-link {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(22, 14, 44, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.22s ease;
    }

    .social-link:hover {
      background: #a855f7;
      color: #ffffff;
      border-color: #d946ef;
      box-shadow: 0 0 18px rgba(217, 70, 239, 0.55);
      transform: translateY(-2px);
    }

    /* Compact Neon Heart Cursor Companion */
    .cyber-cursor-heart {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 99999;
      transform: translate3d(-100px, -100px, 0);
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease, transform 0.08s ease-out;
    }

    .cursor-heart-svg {
      width: 18px;
      height: 18px;
      overflow: visible;
      filter: drop-shadow(0 0 6px rgba(217, 70, 239, 0.75));
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .cursor-heart-path {
      fill: rgba(217, 70, 239, 0.3);
      stroke: #c084fc;
      stroke-width: 1.6;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    .cyber-cursor-heart.cursor-hovered .cursor-heart-svg {
      transform: scale(1.35);
      filter: drop-shadow(0 0 12px rgba(217, 70, 239, 0.95)) drop-shadow(0 0 20px rgba(192, 132, 252, 0.8));
    }

    .cyber-cursor-heart.cursor-hovered .cursor-heart-path {
      fill: rgba(217, 70, 239, 0.65);
      stroke: #ffffff;
    }

    .cyber-cursor-heart.cursor-clicking .cursor-heart-svg {
      transform: scale(0.85);
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
        height: auto;
        min-height: 100vh;
      }
      .avatar-wrapper {
        width: 105px;
        height: 105px;
        margin-bottom: 10px;
      }
      .domains-compact {
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      .domain-tag {
        width: 100%;
        justify-content: center;
      }
      .portal-cta {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Supernova Burst & Living Sparkles Canvas -->
  <canvas id="sparkle-canvas"></canvas>

  <!-- Atmospheric Cosmic Glow -->
  <div class="cosmic-glow-top"></div>

  <!-- Main Portal Container -->
  <main class="portal-container" role="main">

    <!-- 1. Photo Avatar Section (Initially hidden, revealed after sparkle greeting forms) -->
    <div class="avatar-section reveal-item" id="avatar-section">
      <div class="avatar-wrapper">
        <div class="avatar-orbit-outer"></div>
        <div class="avatar-orbit-inner"></div>
        <div class="avatar-glow"></div>
        <div class="avatar-photo-frame">
          <img src="parthu.jpg" alt="Parthasarathi S" onerror="this.src='partha.jpeg'">
        </div>
      </div>
    </div>

    <!-- 2. Permanent Sparkle Typography Anchor + Shimmering Hand Emoji -->
    <div class="sparkle-hero-container" id="sparkle-hero-container">
      <div class="title-anchor" id="title-anchor"></div>
      <div class="emoji-wrapper" id="emoji-wrapper">
        <span class="wave-emoji" aria-label="Waving Hand">👋</span>
      </div>
      <h1 class="sr-only">Hi 👋, I'm Parthasarathi S</h1>
    </div>

    <!-- 3. Bottom Details Section (Initially hidden, revealed after sparkle greeting forms) -->
    <div class="details-section reveal-item" id="details-section">

      <!-- Academic Role -->
      <p class="portal-academic">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Computer Science & Engineering Student</span>
      </p>

      <!-- Interest Domains -->
      <div class="domains-compact">
        <span class="domain-label">Interest Domains:</span>
        <span class="domain-tag"><i class="fa-solid fa-code"></i> Software Engineering</span>
        <span class="domain-tag"><i class="fa-solid fa-chart-line"></i> Data Analytics</span>
      </div>

      <!-- Enter Portfolio CTA Button -->
      <div class="portal-cta">
        <a href="home.html" class="enter-btn" id="enterBtn" title="Enter Portfolio">
          <span>Enter Portfolio</span>
          <i class="fa-solid fa-arrow-right-long"></i>
        </a>
      </div>

      <!-- Social Shortcuts -->
      <nav class="portal-socials" aria-label="Social Links">
        <a href="https://www.linkedin.com/in/parthasarathi-s-790421330" target="_blank" rel="noopener noreferrer" class="social-link" title="LinkedIn Profile" aria-label="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
        <a href="https://github.com/parthasarathi3004" target="_blank" rel="noopener noreferrer" class="social-link" title="GitHub Profile" aria-label="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="https://leetcode.com/u/parthasarathi6/" target="_blank" rel="noopener noreferrer" class="social-link" title="LeetCode Profile" aria-label="LeetCode">
          <i class="fa-solid fa-code"></i>
        </a>
        <a href="https://www.hackerrank.com/profile/parthasarathi301" target="_blank" rel="noopener noreferrer" class="social-link" title="HackerRank Profile" aria-label="HackerRank">
          <i class="fa-brands fa-hackerrank"></i>
        </a>
      </nav>

    </div>

  </main>

  <!-- Permanent Sparkle Typography Engine & Subtle Heart Cursor -->
  <script src="sparkle-assemble.js"></script>
  <script src="cursor.js"></script>

</body>
</html>
